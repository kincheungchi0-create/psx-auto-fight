<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PSX Auto Fight</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0d10; overflow: hidden; font-family: ui-sans-serif, system-ui, sans-serif; }
    #hud {
      position: fixed; left: 3%; right: 3%; top: 16px; z-index: 2;
      color: #fff; font-weight: 800; text-shadow: 1px 2px #111;
      pointer-events: none;
    }
    .battle-hud { display: grid; grid-template-columns: 1fr 100px 1fr; gap: 14px; align-items: start; }
    .fighter-name { font-size: clamp(12px, 2vw, 20px); margin-bottom: 5px; }
    .fighter-right { text-align: right; }
    .health { height: 18px; background: #591d2b; border: 3px solid #e9e2c8; box-shadow: 0 3px 0 #27222b; }
    .health-fill { height: 100%; width: 100%; background: linear-gradient(#fff58d, #e5a32e); transition: width .18s; }
    .fighter-right .health-fill { margin-left: auto; }
    .match-info { text-align: center; font-size: clamp(12px, 1.5vw, 16px); }
    #timer { font-size: clamp(25px, 4vw, 42px); line-height: 1; color: #ffe082; }
    #status { text-align: center; margin-top: 10px; font-size: clamp(14px, 2vw, 22px); }
    @media (max-width: 600px) { .battle-hud { grid-template-columns: 1fr 55px 1fr; gap: 6px; } .health { height: 12px; } #credit { max-width: 90vw; } }
    #credit {
      position: fixed; right: 12px; bottom: 10px; z-index: 2; color: #9aa3ad;
      font-size: 11px; background: rgba(0,0,0,.35); padding: 6px 8px; border-radius: 8px;
    }
    #credit a { color: #c9d4e0; }
    canvas { display: block; }
  </style>
</head>
<body>

  </div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",

  <script type="module" onerror="document.getElementById('status').textContent = 'Load failed: unable to start the game. Please check your connection and refresh.'">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { FightingEngine } from './fighting-engine.mjs';
import { findContact } from './contact.mjs';

const statusEl = document.getElementById('status');
const setStatus = (t) => { statusEl.textContent = t; };

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a222c);
scene.fog = new THREE.Fog(0x1a222c, 12, 28);

const camera = new THREE.OrthographicCamera(-5, 5, 3, -3, 0.1, 80);
camera.position.set(0, 2.4, 12);
camera.lookAt(0, 1.2, 0);
function resizeCamera() {
  const aspect = innerWidth / innerHeight;
  const halfHeight = Math.max(3.2, 5.2 / aspect);
  camera.left = -halfHeight * aspect; camera.right = halfHeight * aspect;
  camera.top = halfHeight; camera.bottom = -halfHeight;
  camera.updateProjectionMatrix();
}
resizeCamera();

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xcfe3ff, 0x334155, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(5, 10, 4);
sun.castShadow = true;
scene.add(sun);

// A fixed side-view stage keeps the action on a single fighting plane.
const ground = new THREE.Mesh(new THREE.PlaneGeometry(30, 12), new THREE.MeshStandardMaterial({ color: 0x39434b, roughness: 0.95 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
const backdrop = new THREE.Mesh(new THREE.PlaneGeometry(30, 9), new THREE.MeshStandardMaterial({ color: 0x263b4c }));
backdrop.position.set(0, 4.5, -3);
scene.add(backdrop);
for (let x = -12; x <= 12; x += 2) {
  const pillar = new THREE.Mesh(new THREE.BoxGeometry(0.15, 5, 0.12), new THREE.MeshStandardMaterial({ color: 0x526579 }));
  pillar.position.set(x, 2.5, -2.9); scene.add(pillar);
}
const stageEdge = new THREE.Mesh(new THREE.BoxGeometry(30, 0.09, 0.08), new THREE.MeshStandardMaterial({ color: 0xb58a51 }));
stageEdge.position.set(0, 0.05, -2.8); scene.add(stageEdge);
const ARENA_EDGE = 4.2;

const ROSTER = [
  { url: 'models/sketchgirl/character.glb', tag: 'sketchgirl', name: 'Anime Girl', tint: 0xff78bf, custom: 'sketchgirl' },
  { url: 'models/kungfu/character.glb', tag: 'kungfu', name: 'Kung Fu Fighter', tint: 0x80edff, custom: 'kungfu' },
];

const BASE_MOVES = {
  idle: ['capoeira'],
  walk: ['ginga_forward'],
  jab: ['bencao'],
  heavy: ['chapa_2', 'pontera', 'bencao'],
  kick: ['armada', 'armada_to_esquiva', 'chapa_giratoria', 'chapa_giratoria_2', 'chapaeu_de_couro', 'martelo_2', 'martelo_3', 'martelo_do_chau', 'martelo_do_chau_sem_mao', 'meia_lua_de_compasso', 'meia_lua_de_compasso_back', 'meia_lua_de_frente', 'queshada_1', 'queshada_2', 'rasteira_1', 'rasteira_2'],
  hit: ['esquiva_1', 'esquiva_2', 'esquiva_3', 'esquiva_4', 'esquiva_5'],
};

function clipMap(gltfActions, tag) {
  const map = {};
  for (const [name, action] of Object.entries(gltfActions)) {
    const key = name.replace(new RegExp('_' + tag + '$'), '').toLowerCase();
    map[key] = action;
  }
  return map;
}

const KUNGFU_MOVES = {
  idle: ['kung fu idle guard', 'kung fu idle guard2', 'kung fu idle guard 3'],
  walk: ['kung fu idle guard'],
  jab: ['kung fu sexy punch', 'kung fu sexy no look punch', 'kung fu phantom punch'],
  heavy: ['kung fu spinning elbow', 'kung fu double push punch', 'kung fu fake headbutt push', 'kung fu double head slam'],
  kick: ['kung fu sexy kick'],
  hit: ['kung fu the misleader'],
};

// Keep the fighters' bodies apart while still allowing their limbs to reach.
const ATTACK_ENTER = 1.15;
const ATTACK_STOP = 0.95;
const HAND_HIT_R = 0.34;
const FOOT_HIT_R = 0.38;

// Spin Flip Kick native clip ~3.7s @30fps; play at 1.3× ≈ 2.85s
const MOVES = {
  jab:   { label: '直拳', limb: 'hand', dmg: [12, 18], dur: 0.55, hitAt: 0.28, enter: 1.15, step: 0.5 },
  heavy: { label: '重拳', limb: 'hand', dmg: [22, 30], dur: 0.85, hitAt: 0.42, enter: 1.15, step: 0.35 },
  kick:  { label: '踢擊', limb: 'foot', dmg: [20, 32], dur: 2.85, hitAt: 0.85, hitEnd: 2.15, enter: 1.25, step: 0.45, timeScale: 1.3 },
};

function findBone(root, name) {
  let found = null;
  root.traverse((o) => {
    if (found) return;
    if (o.isBone && o.name === name) found = o;
  });
  return found;
}

function findBoneLoose(root, ...names) {
  for (const n of names) {
    const b = findBone(root, n);
    if (b) return b;
  }
  return null;
}

/** Shared Mixamo X Bot template (scene + clip). Cloned per fighter. */
let xbotTemplate = null; // { scene, clip }

class Fighter {
  constructor(root, mixer, clips, name, tint, custom = false) {
    this.root = root;
    this.mixer = mixer;
    this.clips = clips;
    this.custom = custom;
    this.moveSets = custom === 'kungfu' ? KUNGFU_MOVES : BASE_MOVES;
    this.name = name;
    this.hp = 100;
    this.state = 'idle';
    this.move = null;
    this.target = null;
    this.cooldown = 0.4 + Math.random();
    this.dodgeCooldown = 0;
    this.alive = true;
    this.busyUntil = 0;
    this.pendingHit = null;
    this.kickT = 0;
    this.kickDur = 0;
    this.kickSide = 'l';
    this.usingXbot = false;
    this.xbot = null;
    this.xbotMixer = null;
    this.xbotAction = null;
    this.xbotBones = {};
    this.psxMeshes = [];
    this.reactionStart = 0;
    root.traverse((o) => {
      if (o.isMesh) this.psxMeshes.push(o);
    });
    this.bones = {
      hips: findBoneLoose(root, 'Hips', 'mixamorigHips', 'mixamorig_Hips', '_03_-_HipN', 'CC_Base_Hip_02'),
      spine: findBoneLoose(root, 'Spine', 'mixamorigSpine', 'mixamorig_Spine', '_13_-_BustN', 'CC_Base_Spine02_035'),
      head: findBoneLoose(root, 'Head', 'mixamorigHead', 'mixamorig_Head', '_23_-_HeadN', 'CC_Base_Head_038'),
      lArm: findBone(root, 'LeftUpLeg') || findBone(root, 'LeftArm'),
      lUpLeg: findBone(root, 'LeftUpLeg'),
      lLeg: findBone(root, 'LeftLeg'),
      lFoot: findBoneLoose(root, 'LeftFoot', 'mixamorigLeftFoot', 'mixamorig_LeftFoot', '_06_-_LFootJ', 'CC_Base_L_Foot_06'),
      rUpLeg: findBone(root, 'RightUpLeg'),
      rLeg: findBone(root, 'RightLeg'),
      rFoot: findBoneLoose(root, 'RightFoot', 'mixamorigRightFoot', 'mixamorig_RightFoot', '_10_-_RFootJ', 'CC_Base_R_Foot_021'),
      lHand: findBoneLoose(root, 'LeftHand', 'mixamorigLeftHand', 'mixamorig_LeftHand', '_17_-_LHandN', 'CC_Base_L_Hand_055'),
      rHand: findBoneLoose(root, 'RightHand', 'mixamorigRightHand', 'mixamorig_RightHand', '_21_-_RHandN', 'CC_Base_R_Hand_083'),
      lFore: findBone(root, 'LeftForeArm'),
      rFore: findBone(root, 'RightForeArm'),
    };
    // Calibrate the distance from the foot joints to the soles in the bind pose.
    // The mesh bounds are measured once; subsequent frames only read two bones.
    this.soleOffset = null;
    const feet = [this.bones.lFoot, this.bones.rFoot].filter(Boolean);
    if (custom && feet.length) {
      root.updateMatrixWorld(true);
      const bounds = new THREE.Box3().setFromObject(root.children[0], true);
      const lowestJoint = Math.min(...feet.map((foot) => foot.getWorldPosition(new THREE.Vector3()).y));
      if (Number.isFinite(bounds.min.y) && Number.isFinite(lowestJoint)) {
        this.soleOffset = Math.max(0, lowestJoint - bounds.min.y);
      }
    }
    // The native model's bind pose has not yet been evaluated by its animation.
    if (custom === 'kungfu') this.soleOffset = 0.08;
    this._rest = {};
    for (const [k, b] of Object.entries(this.bones)) {
      if (b) this._rest[k] = b.quaternion.clone();
    }
    this.marker = new THREE.Mesh(
      new THREE.SphereGeometry(0.08, 10, 10),
      new THREE.MeshBasicMaterial({ color: tint })
    );
    this.marker.position.y = 2.05;
    root.add(this.marker);
    this.moveLabel = new THREE.Sprite(
      new THREE.SpriteMaterial({
        map: (() => {
          const c = document.createElement('canvas');
          c.width = 256; c.height = 64;
          const g = c.getContext('2d');
          g.fillStyle = 'rgba(0,0,0,0)';
          g.fillRect(0,0,256,64);
          const tex = new THREE.CanvasTexture(c);
          tex.colorSpace = THREE.SRGBColorSpace;
          this._labelCanvas = c;
          this._labelCtx = g;
          this._labelTex = tex;
          return tex;
        })(),
        transparent: true, depthTest: false,
      })
    );
    this.moveLabel.scale.set(1.2, 0.3, 1);
    this.moveLabel.position.y = 2.35;
    this.moveLabel.visible = false;
    root.add(this.moveLabel);
    this.play('idle', true);
  }

  /** Clone Mixamo X Bot under this fighter; hidden until 旋風腳. */
  attachXbot(template) {
    if (!template?.scene || !template?.clip) return;
    const clone = SkeletonUtils.clone(template.scene);
    clone.name = 'xbot_' + this.name;
    clone.visible = false;
    // Facing: Mixamo +Z matches PSX face(); slight Y lift not needed (feet on ground)
    clone.position.set(0, 0, 0);
    clone.rotation.set(0, 0, 0);
    clone.scale.set(1, 1, 1);
    clone.traverse((o) => {
      if (o.isMesh) {
        o.castShadow = true;
        o.receiveShadow = true;
        if (o.material) {
          const mats = Array.isArray(o.material) ? o.material : [o.material];
          for (const m of mats) { m.metalness = 0.05; m.roughness = 0.75; }
        }
      }
    });
    this.root.add(clone);
    this.xbot = clone;
    this.xbotMixer = new THREE.AnimationMixer(clone);
    this.xbotAction = this.xbotMixer.clipAction(template.clip);
    this.xbotAction.clampWhenFinished = true;
    this.xbotAction.setLoop(THREE.LoopOnce, 1);
    this.xbotBones = {
      hips: findBoneLoose(clone, 'mixamorig:Hips', 'mixamorig_Hips', 'Hips'),
      spine: findBoneLoose(clone, 'mixamorig:Spine', 'mixamorig_Spine', 'Spine'),
      head: findBoneLoose(clone, 'mixamorig:Head', 'mixamorig_Head', 'Head'),
      lFoot: findBoneLoose(clone, 'mixamorig:LeftFoot', 'mixamorig_LeftFoot', 'LeftFoot'),
      rFoot: findBoneLoose(clone, 'mixamorig:RightFoot', 'mixamorig_RightFoot', 'RightFoot'),
    };
  }

  setPsxMeshesVisible(v) {
    for (const m of this.psxMeshes) m.visible = v;
  }

  beginXbotKick(timeScale) {
    if (!this.xbot || !this.xbotAction) return false;
    this.usingXbot = true;
    this.setPsxMeshesVisible(false);
    this.xbot.visible = true;
    // stop PSX attack/idle while X Bot plays
    if (this.current) {
      this.current.fadeOut(0.05);
      this.current = null;
    }
    this.xbotAction.reset();
    this.xbotAction.setLoop(THREE.LoopOnce, 1);
    this.xbotAction.clampWhenFinished = true;
    this.xbotAction.timeScale = timeScale;
    this.xbotAction.enabled = true;
    this.xbotAction.play();
    return true;
  }

  endXbotKick() {
    if (!this.usingXbot) return;
    this.usingXbot = false;
    if (this.xbotAction) {
      this.xbotAction.stop();
      this.xbotAction.enabled = false;
    }
    if (this.xbot) this.xbot.visible = false;
    this.setPsxMeshesVisible(true);
  }

  setMoveLabel(text) {
    const g = this._labelCtx;
    const c = this._labelCanvas;
    g.clearRect(0, 0, c.width, c.height);
    if (!text) { this.moveLabel.visible = false; this._labelTex.needsUpdate = true; return; }
    g.fillStyle = 'rgba(0,0,0,0.55)';
    g.fillRect(8, 8, 240, 48);
    g.fillStyle = '#9fe870';
    g.font = 'bold 28px ui-sans-serif, system-ui, sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(text, 128, 34);
    this._labelTex.needsUpdate = true;
    this.moveLabel.visible = true;
  }

  play(name, loop = false, timeScale = 1) {
    if (this.custom) {
      const choices = this.moveSets[name === 'run' ? 'walk' : name] || this.moveSets.idle;
      const available = choices.filter((key) => this.clips[key]);
      name = available[Math.floor(Math.random() * available.length)] || this.moveSets.jab[0];
    }
    const next = this.clips[name];
    if (!next) return;
    next.reset();
    next.setLoop(loop ? THREE.LoopRepeat : THREE.LoopOnce, Infinity);
    next.clampWhenFinished = !loop;
    next.timeScale = timeScale;
    next.enabled = true;
    if (this.current && this.current !== next) {
      this.current.fadeOut(0.1);
      next.reset().fadeIn(0.1).play();
    } else {
      next.play();
    }
    this.current = next;
  }

  face(point) {
    const dx = point.x - this.root.position.x;
    const dz = point.z - this.root.position.z;
    if (dx * dx + dz * dz > 1e-6) this.root.rotation.y = Math.atan2(dx, dz);
  }

  centerOnArenaPosition() {
    const hip = this.bones.hips;
    if (!this.custom || !hip) return;
    // Animation clips can move the skeleton away from its arena position.
    // Keep the hips above the AI's collision point without suppressing jumps.
    const local = this.root.worldToLocal(hip.getWorldPosition(new THREE.Vector3()));
    const model = this.root.children[0];
    model.position.x -= local.x;
    model.position.z -= local.z;
    this.root.updateMatrixWorld(true);
    if (this.soleOffset !== null) {
      const feet = [this.bones.lFoot, this.bones.rFoot].filter(Boolean);
      const lowestJoint = Math.min(...feet.map((foot) => foot.getWorldPosition(new THREE.Vector3()).y));
      if (Number.isFinite(lowestJoint)) model.position.y += this.soleOffset - lowestJoint;
      this.root.updateMatrixWorld(true);
    }
  }

  bodyPoints() {
    // Prefer Mixamo torso if this fighter is mid-kick (so mutual kicks collide)
    const src = (this.usingXbot && this.xbotBones.hips) ? this.xbotBones : this.bones;
    const keys = ['hips', 'spine', 'head'];
    const pts = [];
    for (const key of keys) {
      const b = src[key];
      if (!b) continue;
      const p = new THREE.Vector3();
      b.getWorldPosition(p);
      pts.push(p);
    }
    if (!pts.length) {
      const p = this.root.position.clone();
      p.y += 1.0;
      pts.push(p);
    }
    return pts;
  }

  strikePoints(limb) {
    if (limb === 'foot' && this.usingXbot) {
      const pts = [];
      for (const key of ['lFoot', 'rFoot']) {
        const b = this.xbotBones[key];
        if (!b) continue;
        const p = new THREE.Vector3();
        b.getWorldPosition(p);
        pts.push({ p, key });
      }
      return pts;
    }
    const keys = limb === 'foot' ? ['lFoot', 'rFoot'] : ['lHand', 'rHand'];
    const pts = [];
    for (const key of keys) {
      const b = this.bones[key];
      if (!b) continue;
      const p = new THREE.Vector3();
      b.getWorldPosition(p);
      pts.push({ p, key });
    }
    return pts;
  }

  limbsTouch(target, limb, history) {
    const strikes = this.strikePoints(limb || 'hand');
    const bodies = target.bodyPoints();
    return findContact(strikes, bodies, limb === 'foot' ? FOOT_HIT_R : HAND_HIT_R, history);
  }

  /** Procedural kick fallback if X Bot missing. */
  applyKickPose(now) {
    if (this.kickDur <= 0) return;
    const t = (now - this.kickT) / this.kickDur;
    if (t < 0 || t > 1) {
      this.resetKickBones();
      this.kickDur = 0;
      return;
    }
    let swing;
    if (t < 0.45) swing = (t / 0.45);
    else if (t < 0.7) swing = 1;
    else swing = 1 - (t - 0.7) / 0.3;
    swing = Math.max(0, Math.min(1, swing));
    const side = this.kickSide;
    const up = this.bones[side + 'UpLeg'];
    const mid = this.bones[side + 'Leg'];
    if (!up) return;
    const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(-1.35 * swing, 0.15 * swing, 0.25 * swing));
    up.quaternion.copy(this._rest[side + 'UpLeg']).multiply(q);
    if (mid && this._rest[side + 'Leg']) {
      const q2 = new THREE.Quaternion().setFromEuler(new THREE.Euler(0.55 * swing, 0, 0));
      mid.quaternion.copy(this._rest[side + 'Leg']).multiply(q2);
    }
  }

  resetKickBones() {
    for (const k of ['lUpLeg', 'lLeg', 'rUpLeg', 'rLeg']) {
      if (this.bones[k] && this._rest[k]) this.bones[k].quaternion.copy(this._rest[k]);
    }
  }

  pickMove() {
    const roll = Math.random();
    if (roll < 0.34) return 'jab';
    if (roll < 0.72) return 'kick';
    return 'heavy';
  }

  startMove(id, now) {
    const m = MOVES[id];
    this.move = id;
    this.state = 'attack';
    const limb = this.custom === 'kungfu' ? m.limb : 'foot';
    this.setMoveLabel(limb === 'foot' ? '踢擊' : m.label);
    this.hitLanded = false;
    if (this.custom) {
      this.play(id, false, 1.2);
      const duration = Math.max(0.5, (this.current?.getClip().duration || 1) / 1.2);
      this.busyUntil = now + duration * 0.95;
      this.cooldown = 0.6 + Math.random() * 0.5;
      this.pendingHit = { at: now + duration * 0.2, until: now + duration * 0.85, target: this.target, limb, label: limb === 'foot' ? '踢擊' : m.label, move: id, window: true, history: new Map() };
      matchEngine.startAttack(this, this.target, {
        activeFrom: this.pendingHit.at, activeUntil: this.pendingHit.until,
        damage: m.dmg[0] + Math.random() * (m.dmg[1] - m.dmg[0]),
      });
      return;
    }
    if (id === 'kick') {
      const scale = m.timeScale || 1.3;
      const ok = this.beginXbotKick(scale);
      if (ok) {
        const clipDur = (this.xbotAction.getClip().duration || 3.7) / scale;
        const dur = Math.min(m.dur, clipDur * 0.98);
        this.kickT = now;
        this.kickDur = 0;
        this.busyUntil = now + dur;
        this.cooldown = 0.85 + Math.random() * 0.45;
        this.pendingHit = {
          at: now + m.hitAt,
          until: now + (m.hitEnd || m.hitAt + 0.5),
          target: this.target,
          limb: 'foot',
          move: id,
          window: true,
        };
      } else {
        // procedural fallback
        this.play('idle', true, 0.3);
        this.kickSide = Math.random() < 0.5 ? 'l' : 'r';
        this.kickT = now;
        this.kickDur = m.dur;
        this.busyUntil = now + m.dur;
        this.cooldown = 0.75 + Math.random() * 0.4;
        this.pendingHit = { at: now + m.hitAt, target: this.target, limb: 'foot', move: id };
      }
    } else {
      const scale = id === 'heavy' ? 0.72 : 1.15;
      this.play('attack', false, scale);
      const ad = (this.clips.attack?.getClip().duration || 0.55) / scale;
      this.busyUntil = now + Math.min(ad, m.dur) * 0.95;
      this.cooldown = (id === 'heavy' ? 1.0 : 0.55) + Math.random() * 0.35;
      this.pendingHit = { at: now + m.hitAt, target: this.target, limb: 'hand', move: id };
    }
  }

  updateReaction(now) {
    const model = this.root.children[0];
    if (this.state === 'death') {
      const progress = Math.min(1, Math.max(0, (now - this.reactionStart) / 0.45));
      model.rotation.x = -1.25 * progress;
    } else if (this.state === 'hit') {
      const progress = Math.min(1, Math.max(0, (now - this.reactionStart) / 0.5));
      model.rotation.x = -0.35 * Math.sin(Math.PI * progress);
    } else {
      model.rotation.x = 0;
    }
  }

  update(dt, now) {
    this.updateReaction(now);
    this.centerOnArenaPosition();

    if (!this.custom && this.move === 'kick' && !this.usingXbot) this.applyKickPose(now);
    else if (this.kickDur > 0 && this.move !== 'kick') { this.resetKickBones(); this.kickDur = 0; }

    if (!this.alive) return;
    this.cooldown -= dt;
    this.dodgeCooldown -= dt;

    if (this.pendingHit) {
      const ph = this.pendingHit;
      const tgt = ph.target;
      const touch = tgt?.alive ? this.limbsTouch(tgt, ph.limb, ph.history || (ph.history = new Map())) : null;
      if (now >= ph.at) {
        const m = MOVES[ph.move] || MOVES.jab;
        if (ph.window) {
          if (this.hitLanded || !this.alive || !tgt?.alive || now > (ph.until || ph.at)) {
            this.pendingHit = null;
          } else {
            const result = matchEngine.tryHit(this, tgt, now, !!touch);
            if (result) {
              this.hitLanded = true;
              this.pendingHit = null;
              if (!result.dodged) showImpact(touch.point, now);
              if (result.blocked) tgt.setMoveLabel('格擋');
              else if (!result.dodged) tgt.takeHit(result.damage, now, this, ph.label || m.label);
            }
          }
        } else {
          this.pendingHit = null;
          if (this.alive && tgt?.alive && touch) {
            showImpact(touch.point, now);
            const dmg = m.dmg[0] + Math.random() * (m.dmg[1] - m.dmg[0]);
            tgt.takeHit(dmg, now, this, ph.label || m.label);
          }
        }
      }
    }

    if (now < this.busyUntil) {
      if (!this.custom && this.state === 'attack' && this.target?.alive) {
        this.face(this.target.root.position);
        const me = this.root.position;
        const them = this.target.root.position;
        const dist = me.distanceTo(them);
        const step = (MOVES[this.move] || MOVES.jab).step;
        if (dist > ATTACK_STOP + 0.04) {
          const dir = new THREE.Vector3(them.x - me.x, 0, them.z - me.z).normalize();
          me.addScaledVector(dir, step * dt);
        }
      }
      return;
    }

    if (this.state === 'attack') {
      matchEngine.cancelAttack(this);
      this.endXbotKick();
      this.resetKickBones();
      this.kickDur = 0;
      this.move = null;
      this.setMoveLabel('');
      this.state = 'idle';
      this.play('idle', true);
    }

    if (!this.target || !this.target.alive) {
      if (this.state !== 'idle') { this.state = 'idle'; this.play('idle', true); }
      return;
    }

    const me = this.root.position;
    const them = this.target.root.position;
    const dist = me.distanceTo(them);
    this.face(them);

    // Defend against an actual nearby attack instead of independently spamming moves.
    if (this.target.state === 'attack' && this.target.pendingHit && dist < 2.3 && this.state !== 'hit' && this.defenseAttack !== this.target.pendingHit) {
      this.defenseAttack = this.target.pendingHit;
      this.willDefend = Math.random() < 0.75;
    }
    if (this.target.state === 'attack' && dist < 2.3 && this.state !== 'hit' && this.willDefend) {
      if (this.state !== 'guard' && this.state !== 'dodge') {
        if (this.dodgeCooldown <= 0 && Math.random() < 0.3) {
          this.state = 'dodge';
          this.play('hit', false, 1.2);
          this.busyUntil = now + 0.6;
          this.dodgeCooldown = 2.5;
          this.setMoveLabel('閃避');
        } else {
          this.state = 'guard';
          this.play('idle', true);
          this.setMoveLabel('防禦');
        }
      }
      return;
    }
    if (this.state === 'dodge' || this.state === 'guard') {
      this.state = 'idle';
      this.setMoveLabel('');
      this.cooldown = Math.max(this.cooldown, 0.3);
      this.play('idle', true);
    }
    if (this.state === 'hit') {
      this.state = 'idle';
      this.setMoveLabel('');
      this.play('idle', true);
    }

    if (dist < ATTACK_STOP) {
      const dir = new THREE.Vector3(me.x - them.x, 0, me.z - them.z);
      if (dir.lengthSq() < 1e-6) dir.set(1, 0, 0);
      dir.normalize();
      me.addScaledVector(dir, (ATTACK_STOP - dist) * 0.5);
    }

    const nextMove = this.cooldown <= 0 ? this.pickMove() : null;
    const need = nextMove ? MOVES[nextMove].enter : ATTACK_ENTER;

    if (dist > need) {
      const run = dist > 2.8;
      if (this.state !== (run ? 'run' : 'walk')) {
        this.state = run ? 'run' : 'walk';
        this.play(this.state, true);
      }
      const speed = run ? 2.8 : 1.5;
      const dir = new THREE.Vector3(them.x - me.x, 0, them.z - me.z).normalize();
      me.addScaledVector(dir, Math.min(speed * dt, Math.max(0, dist - need)));
      me.x = THREE.MathUtils.clamp(me.x, -ARENA_EDGE, ARENA_EDGE);
    } else if (nextMove) {
      this.startMove(nextMove, now);
    } else if (this.state !== 'idle' && this.state !== 'attack') {
      this.state = 'idle';
      this.play('idle', true);
    }
  }

  takeHit(dmg, now, attacker, moveLabel) {
    if (!this.alive) return;
    this.endXbotKick();
    this.resetKickBones();
    this.kickDur = 0;
    this.pendingHit = null;
    this.move = null;
    this.setMoveLabel(moveLabel ? ('中：' + moveLabel) : '');
    this.reactionStart = now;
    if (this.hp <= 0) {
      this.alive = false;
      this.state = 'death';
      this.setMoveLabel('');
      this.play('idle', true);
      this.marker.visible = false;
      return;
    }
    this.state = 'hit';
    this.play('idle', true);
    this.busyUntil = now + 0.5;
  }
}

const loader = new GLTFLoader();
loader.setMeshoptDecoder(MeshoptDecoder);
const fighters = [];
const impacts = [];
function showImpact(point, now) {
  const flash = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 6), new THREE.MeshBasicMaterial({ color: 0xffe17a, transparent: true }));
  flash.position.copy(point); scene.add(flash); impacts.push({ flash, until: now + 0.14 });
}
function updateImpacts(now) {
  for (let i = impacts.length - 1; i >= 0; i--) {
    const impact = impacts[i];
    if (now >= impact.until) { scene.remove(impact.flash); impact.flash.geometry.dispose(); impact.flash.material.dispose(); impacts.splice(i, 1); }
    else impact.flash.material.opacity = (impact.until - now) / 0.14;
  }
}
let matchEngine;
/** Deduped GLTF loads (office/survivor shared by 2 fighters each). */
const gltfCache = new Map();
let xbotLoadPromise = null;

function loadGltf(url) {
  if (!gltfCache.has(url)) gltfCache.set(url, loader.loadAsync(url));
  return gltfCache.get(url);
}

/** Background-load Mixamo X Bot; attach to fighters when ready. */
function ensureXbotLoaded() {
  if (xbotTemplate) return Promise.resolve(xbotTemplate);
  if (xbotLoadPromise) return xbotLoadPromise;
  xbotLoadPromise = (async () => {
    try {
      if (MeshoptDecoder.ready) await MeshoptDecoder.ready;
      const spinGltf = await loader.loadAsync('models/spin_flip_kick_xbot.glb');
      const clip = spinGltf.animations.find((a) => /mixamo|spin|layer/i.test(a.name)) || spinGltf.animations[0];
      if (!clip) throw new Error('no animation in xbot glb');
      xbotTemplate = { scene: spinGltf.scene, clip };
      for (const f of fighters) {
        if (!f.custom && !f.xbot) f.attachXbot(xbotTemplate);
      }
      console.info('xbot kick loaded', clip.name, 'dur', clip.duration, 'tracks', clip.tracks.length);
      return xbotTemplate;
    } catch (e) {
      console.warn('xbot kick missing, procedural fallback', e);
      xbotTemplate = null;
      return null;
    }
  })();
  return xbotLoadPromise;
}

async function spawn(spec, index, total) {
  const gltf = await loadGltf(spec.url);
  // Clone so two roster entries sharing a URL get independent skeletons/meshes
  const model = SkeletonUtils.clone(gltf.scene);
  const root = new THREE.Group();
  root.add(model);
  if (spec.custom) {
    const box = new THREE.Box3().setFromObject(model);
    const height = box.max.y - box.min.y;
    if (height > 0) {
      const scale = spec.custom === 'sketchgirl' ? 10 : 0.62;
      model.scale.multiplyScalar(scale);
      model.position.y = 0;
    }
  }
  root.traverse((o) => {
    if (o.isMesh) {
      o.castShadow = true;
      o.receiveShadow = true;
      if (o.material) {
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        for (const m of mats) { m.metalness = 0; m.roughness = 0.9; }
      }
    }
  });
  const mixer = new THREE.AnimationMixer(root);
  const actions = {};
  for (const clip of gltf.animations) actions[clip.name] = mixer.clipAction(clip);
  if (spec.custom === 'sketchgirl') {
    const names = [...new Set(Object.values(BASE_MOVES).flat())];
    const results = await Promise.allSettled(names.map((name) => loadGltf(`models/${spec.custom}/${name}.glb`)));
    results.forEach((result, i) => {
      if (result.status === 'fulfilled' && result.value.animations[0]) {
        const clip = result.value.animations[0].clone();
        clip.tracks = clip.tracks.filter((track) => {
          const nodeName = THREE.PropertyBinding.parseTrackName(track.name).nodeName;
          return !/^Armature\./.test(track.name) &&
            (spec.custom !== 'sketchgirl' || track.name.endsWith('.quaternion')) &&
            !!THREE.PropertyBinding.findNode(root, nodeName);
        });
        // Root motion is controlled by the arena AI, not by the animation clip.
        for (const track of clip.tracks) {
          if (/(Hips|TransN)\.position$/.test(track.name)) {
            for (let i = 3; i < track.values.length; i += 3) {
              track.values[i] = track.values[0];
              track.values[i + 2] = track.values[2];
            }
          }
        }
        actions[names[i]] = mixer.clipAction(clip);
      } else if (result.status === 'rejected') console.warn('Animation unavailable:', names[i], result.reason);
    });
  }
  const clips = clipMap(actions, spec.tag);
  root.position.set(index === 0 ? -3 : 3, 0, 0);
  root.rotation.y = index === 0 ? Math.PI / 2 : -Math.PI / 2;
  scene.add(root);
  const f = new Fighter(root, mixer, clips, spec.name, spec.tint, spec.custom);
  if (xbotTemplate && !spec.custom) f.attachXbot(xbotTemplate);
  return f;
}

function pickTargets() {
  const alive = fighters.filter((f) => f.alive);
  for (const f of fighters) {
    if (!f.alive) { f.target = null; continue; }
    const others = alive.filter((o) => o !== f);
    if (!others.length) { f.target = null; continue; }
    others.sort((a, b) => a.root.position.distanceToSquared(f.root.position) - b.root.position.distanceToSquared(f.root.position));
    f.target = others[0];
  }
}

function separateFighters() {
  for (let i = 0; i < fighters.length; i++) {
    for (let j = i + 1; j < fighters.length; j++) {
      const a = fighters[i], b = fighters[j];
      if (!a.alive || !b.alive) continue;
      const delta = new THREE.Vector3().subVectors(b.root.position, a.root.position);
      delta.y = 0;
      const distance = delta.length();
      if (distance >= ATTACK_STOP) continue;
      if (distance < 0.001) delta.set(1, 0, 0);
      else delta.multiplyScalar(1 / distance);
      const push = (ATTACK_STOP - distance) / 2;
      a.root.position.addScaledVector(delta, -push);
      b.root.position.addScaledVector(delta, push);
    }
  }
}

function resetRound() {
  fighters.forEach((f, i) => {
    f.endXbotKick();
    f.hp = 100;
    f.alive = true;
    f.state = 'idle';
    f.move = null;
    f.pendingHit = null;
    f.hitLanded = false;
    f.busyUntil = 0;
    f.cooldown = 0.5 + Math.random() * 0.5;
    f.dodgeCooldown = 0;
    f.defenseAttack = null;
    f.willDefend = false;
    f.marker.visible = true;
    f.setMoveLabel('');
    f.root.position.set(i === 0 ? -3 : 3, 0, 0);
    f.root.children[0].rotation.x = 0;
    f.play('idle', true);
  });
  pickTargets();
  fighters.forEach(f => f.face(f.target.root.position));
}

async function main() {
  setStatus('Loading characters…');
  // Prefetch unique PSX models in parallel (2 URLs, not 4 serial)
  await Promise.all([...new Set(ROSTER.map((r) => r.url))].map(loadGltf));
  const spawned = await Promise.all(ROSTER.map((spec, i) => spawn(spec, i, ROSTER.length)));
  fighters.push(...spawned);
  matchEngine = new FightingEngine(fighters, {
    startTime: performance.now() / 1000,
    onRoundStart: resetRound,
    onRoundEnd: () => {
      for (const f of fighters) {
        f.pendingHit = null;
        f.move = null;
        f.setMoveLabel('');
        if (f.alive) { f.state = 'idle'; f.play('idle', true); }
      }
    },
  });

  // X Bot (~meshopt) loads in background — kick falls back to procedural until ready
  if (fighters.some((f) => !f.custom)) ensureXbotLoaded();

  const clock = new THREE.Clock();
  function tick() {
    const dt = Math.min(clock.getDelta(), 0.05);
    const now = performance.now() / 1000;
    matchEngine.step(now);
    if (matchEngine.phase === 'fight') {
      for (const f of fighters) { f.mixer.update(dt); if (f.xbotMixer && f.usingXbot) f.xbotMixer.update(dt); f.updateReaction(now); f.centerOnArenaPosition(); }
      for (const f of fighters) f.update(dt, now);
      separateFighters();
      for (const f of fighters) { f.root.position.z = 0; f.root.position.x = THREE.MathUtils.clamp(f.root.position.x, -ARENA_EDGE, ARENA_EDGE); }
      pickTargets();
    } else {
      for (const f of fighters) { f.mixer.update(dt); f.updateReaction(now); f.centerOnArenaPosition(); }
    }
    fighters.forEach((f, i) => { document.getElementById(`health${i}`).style.width = `${Math.max(0, f.hp)}%`; });
    document.getElementById('timer').textContent = Math.ceil(matchEngine.remaining);
    document.getElementById('score').textContent = matchEngine.scores.join(' : ');
    const roundStatus = matchEngine.phase === 'ready' ? `第 ${matchEngine.round} 回合 — 準備！` : matchEngine.phase === 'fight' ? '' : matchEngine.result;
    setStatus(roundStatus);
    updateImpacts(now);
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }
  tick();
}

addEventListener('resize', () => {
  resizeCamera();
  renderer.setSize(innerWidth, innerHeight);
});

main().catch((e) => {
  console.error(e);
  setStatus('Load failed: ' + e.message);
});
  </script>
