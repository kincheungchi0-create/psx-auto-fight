<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PSX Auto Fight — Babylon.js</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0d10; overflow: hidden; font-family: ui-sans-serif, system-ui, sans-serif; }
    #hud {
      position: fixed; left: 3%; right: 3%; top: 16px; z-index: 2;
      color: #fff; font-weight: 800; text-shadow: 1px 2px #111;
      pointer-events: none;
    }
    .battle-hud { display: grid; grid-template-columns: 1fr 100px 1fr; gap: 14px; align-items: start; }
    .fighter-name { font-size: clamp(12px, 2vw, 20px); margin-bottom: 5px; }
    .fighter-right { text-align: right; }
    .health { height: 18px; background: #591d2b; border: 3px solid #e9e2c8; box-shadow: 0 3px 0 #27222b; }
    .health-fill { height: 100%; width: 100%; background: linear-gradient(#fff58d, #e5a32e); transition: width .18s; }
    .fighter-right .health-fill { margin-left: auto; }
    .match-info { text-align: center; font-size: clamp(12px, 1.5vw, 16px); }
    #timer { font-size: clamp(25px, 4vw, 42px); line-height: 1; color: #ffe082; }
    #status { text-align: center; margin-top: 10px; font-size: clamp(14px, 2vw, 22px); }
    @media (max-width: 600px) { .battle-hud { grid-template-columns: 1fr 55px 1fr; gap: 6px; } .health { height: 12px; } #credit { max-width: 90vw; } }
    #credit {
      position: fixed; right: 12px; bottom: 10px; z-index: 2; color: #9aa3ad;
      font-size: 11px; background: rgba(0,0,0,.35); padding: 6px 8px; border-radius: 8px;
    }
    #credit a { color: #c9d4e0; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="battle-hud">
      <div><div class="fighter-name">ANIME GIRL</div><div class="health"><div id="health0" class="health-fill"></div></div></div>
      <div class="match-info"><div id="timer">60</div><div id="score">0 : 0</div></div>
      <div class="fighter-right"><div class="fighter-name">KUNG FU FIGHTER</div><div class="health"><div id="health1" class="health-fill"></div></div></div>
    </div>
    <div id="status">載入角色中…</div>
  </div>
  <div id="credit">
    Models: <a href="https://sketchfab.com/3d-models/anime-girl-character-free-gameready-animated-b8e1967c0703492e8121d9457f056d27" target="_blank" rel="noopener">Anime Girl by RahulTambat (modified)</a> · <a href="https://sketchfab.com/3d-models/mr-sexy-man-fighter-with-13-animations-127cc242790c422fb9599f774b1c9642" target="_blank" rel="noopener">Mr Sexy Man by Jungle Jim</a> · Animations: <a href="https://www.mixamo.com/" target="_blank" rel="noopener">Adobe Mixamo</a> · CC BY 4.0
  </div>
  <script src="https://cdn.jsdelivr.net/npm/babylonjs@9.32.0/babylon.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/babylonjs-loaders@9.32.0/babylonjs.loaders.min.js"></script>
  <script type="module" src="./babylon-game.mjs"></script>
</body>
</html>
