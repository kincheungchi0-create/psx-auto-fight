<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PSX Auto Fight</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0d10; overflow: hidden; font-family: ui-sans-serif, system-ui, sans-serif; }
    #hud {
      position: fixed; left: 12px; top: 12px; z-index: 2; color: #e8ecf1;
      background: rgba(0,0,0,.45); padding: 10px 12px; border-radius: 10px;
      font-size: 13px; line-height: 1.45; max-width: min(520px, 92vw);
    }
    #hud b { color: #9fe870; }
    #credit {
      position: fixed; right: 12px; bottom: 10px; z-index: 2; color: #9aa3ad;
      font-size: 11px; background: rgba(0,0,0,.35); padding: 6px 8px; border-radius: 8px;
    }
    #credit a { color: #c9d4e0; }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="hud">
    <div><b>Auto mode</b> — 直拳／重拳／旋風腳 Mixamo X Bot（手腳骨碰撞）</div>
    <div id="status">Loading…</div>
  </div>
  <div id="credit">
    Models: <a href="https://heyheythere.itch.io/psx-people-free" target="_blank" rel="noopener">PSX People Free</a> · Kick: <a href="https://www.mixamo.com/" target="_blank" rel="noopener">Mixamo Spin Flip Kick (X Bot)</a> · CC BY 4.0
  </div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" onerror="document.getElementById('status').textContent = 'Load failed: unable to start the game. Please check your connection and refresh.'">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

const statusEl = document.getElementById('status');
const setStatus = (t) => { statusEl.textContent = t; };

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a222c);
scene.fog = new THREE.Fog(0x1a222c, 12, 28);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 80);
camera.position.set(0, 4.2, 9);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.1, 0);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.49;

scene.add(new THREE.HemisphereLight(0xcfe3ff, 0x334155, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(5, 10, 4);
sun.castShadow = true;
scene.add(sun);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(8, 48),
  new THREE.MeshStandardMaterial({ color: 0x2b3642, roughness: 0.95 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const ring = new THREE.Mesh(
  new THREE.RingGeometry(7.6, 8, 64),
  new THREE.MeshBasicMaterial({ color: 0x5b6b7c, side: THREE.DoubleSide })
);
ring.rotation.x = -Math.PI / 2;
ring.position.y = 0.01;
scene.add(ring);

const ROSTER = [
  { url: 'models/office_worker.glb', tag: 'office_worker', name: 'Office A', tint: 0x8ecae6 },
  { url: 'models/survivor_woman.glb', tag: 'survivor_woman', name: 'Survivor A', tint: 0xffb703 },
  { url: 'models/office_worker.glb', tag: 'office_worker', name: 'Office B', tint: 0x219ebc },
  { url: 'models/survivor_woman.glb', tag: 'survivor_woman', name: 'Survivor B', tint: 0xfb8500 },
];

function clipMap(gltfActions, tag) {
  const map = {};
  for (const [name, action] of Object.entries(gltfActions)) {
    const key = name.replace(new RegExp('_' + tag + '$'), '').toLowerCase();
    map[key] = action;
  }
  return map;
}

const ATTACK_ENTER = 0.78;
const ATTACK_STOP = 0.50;
const HAND_HIT_R = 0.42;
const FOOT_HIT_R = 0.58;

// Spin Flip Kick native clip ~3.7s @30fps; play at 1.3× ≈ 2.85s
const MOVES = {
  jab:   { label: '直拳', limb: 'hand', dmg: [12, 18], dur: 0.55, hitAt: 0.28, enter: 0.78, step: 0.5 },
  heavy: { label: '重拳', limb: 'hand', dmg: [22, 30], dur: 0.85, hitAt: 0.42, enter: 0.82, step: 0.35 },
  kick:  { label: '旋風腳', limb: 'foot', dmg: [20, 32], dur: 2.85, hitAt: 0.85, hitEnd: 2.15, enter: 0.95, step: 0.45, timeScale: 1.3 },
};

function findBone(root, name) {
  let found = null;
  root.traverse((o) => {
    if (found) return;
    if (o.isBone && o.name === name) found = o;
  });
  return found;
}

function findBoneLoose(root, ...names) {
  for (const n of names) {
    const b = findBone(root, n);
    if (b) return b;
  }
  return null;
}

/** Shared Mixamo X Bot template (scene + clip). Cloned per fighter. */
let xbotTemplate = null; // { scene, clip }

class Fighter {
  constructor(root, mixer, clips, name, tint) {
    this.root = root;
    this.mixer = mixer;
    this.clips = clips;
    this.name = name;
    this.hp = 100;
    this.state = 'idle';
    this.move = null;
    this.target = null;
    this.cooldown = 0.4 + Math.random();
    this.alive = true;
    this.busyUntil = 0;
    this.pendingHit = null;
    this.kickT = 0;
    this.kickDur = 0;
    this.kickSide = 'l';
    this.usingXbot = false;
    this.xbot = null;
    this.xbotMixer = null;
    this.xbotAction = null;
    this.xbotBones = {};
    this.psxMeshes = [];
    root.traverse((o) => {
      if (o.isMesh) this.psxMeshes.push(o);
    });
    this.bones = {
      hips: findBone(root, 'Hips'),
      spine: findBone(root, 'Spine'),
      head: findBone(root, 'Head'),
      lArm: findBone(root, 'LeftUpLeg') || findBone(root, 'LeftArm'),
      lUpLeg: findBone(root, 'LeftUpLeg'),
      lLeg: findBone(root, 'LeftLeg'),
      lFoot: findBone(root, 'LeftFoot'),
      rUpLeg: findBone(root, 'RightUpLeg'),
      rLeg: findBone(root, 'RightLeg'),
      rFoot: findBone(root, 'RightFoot'),
      lHand: findBone(root, 'LeftHand'),
      rHand: findBone(root, 'RightHand'),
      lFore: findBone(root, 'LeftForeArm'),
      rFore: findBone(root, 'RightForeArm'),
    };
    this._rest = {};
    for (const [k, b] of Object.entries(this.bones)) {
      if (b) this._rest[k] = b.quaternion.clone();
    }
    this.marker = new THREE.Mesh(
      new THREE.SphereGeometry(0.08, 10, 10),
      new THREE.MeshBasicMaterial({ color: tint })
    );
    this.marker.position.y = 2.05;
    root.add(this.marker);
    this.moveLabel = new THREE.Sprite(
      new THREE.SpriteMaterial({
        map: (() => {
          const c = document.createElement('canvas');
          c.width = 256; c.height = 64;
          const g = c.getContext('2d');
          g.fillStyle = 'rgba(0,0,0,0)';
          g.fillRect(0,0,256,64);
          const tex = new THREE.CanvasTexture(c);
          tex.colorSpace = THREE.SRGBColorSpace;
          this._labelCanvas = c;
          this._labelCtx = g;
          this._labelTex = tex;
          return tex;
        })(),
        transparent: true, depthTest: false,
      })
    );
    this.moveLabel.scale.set(1.2, 0.3, 1);
    this.moveLabel.position.y = 2.35;
    this.moveLabel.visible = false;
    root.add(this.moveLabel);
    this.play('idle', true);
  }

  /** Clone Mixamo X Bot under this fighter; hidden until 旋風腳. */
  attachXbot(template) {
    if (!template?.scene || !template?.clip) return;
    const clone = SkeletonUtils.clone(template.scene);
    clone.name = 'xbot_' + this.name;
    clone.visible = false;
    // Facing: Mixamo +Z matches PSX face(); slight Y lift not needed (feet on ground)
    clone.position.set(0, 0, 0);
    clone.rotation.set(0, 0, 0);
    clone.scale.set(1, 1, 1);
    clone.traverse((o) => {
      if (o.isMesh) {
        o.castShadow = true;
        o.receiveShadow = true;
        if (o.material) {
          const mats = Array.isArray(o.material) ? o.material : [o.material];
          for (const m of mats) { m.metalness = 0.05; m.roughness = 0.75; }
        }
      }
    });
    this.root.add(clone);
    this.xbot = clone;
    this.xbotMixer = new THREE.AnimationMixer(clone);
    this.xbotAction = this.xbotMixer.clipAction(template.clip);
    this.xbotAction.clampWhenFinished = true;
    this.xbotAction.setLoop(THREE.LoopOnce, 1);
    this.xbotBones = {
      hips: findBoneLoose(clone, 'mixamorig:Hips', 'mixamorig_Hips', 'Hips'),
      spine: findBoneLoose(clone, 'mixamorig:Spine', 'mixamorig_Spine', 'Spine'),
      head: findBoneLoose(clone, 'mixamorig:Head', 'mixamorig_Head', 'Head'),
      lFoot: findBoneLoose(clone, 'mixamorig:LeftFoot', 'mixamorig_LeftFoot', 'LeftFoot'),
      rFoot: findBoneLoose(clone, 'mixamorig:RightFoot', 'mixamorig_RightFoot', 'RightFoot'),
    };
  }

  setPsxMeshesVisible(v) {
    for (const m of this.psxMeshes) m.visible = v;
  }

  beginXbotKick(timeScale) {
    if (!this.xbot || !this.xbotAction) return false;
    this.usingXbot = true;
    this.setPsxMeshesVisible(false);
    this.xbot.visible = true;
    // stop PSX attack/idle while X Bot plays
    if (this.current) {
      this.current.fadeOut(0.05);
      this.current = null;
    }
    this.xbotAction.reset();
    this.xbotAction.setLoop(THREE.LoopOnce, 1);
    this.xbotAction.clampWhenFinished = true;
    this.xbotAction.timeScale = timeScale;
    this.xbotAction.enabled = true;
    this.xbotAction.play();
    return true;
  }

  endXbotKick() {
    if (!this.usingXbot) return;
    this.usingXbot = false;
    if (this.xbotAction) {
      this.xbotAction.stop();
      this.xbotAction.enabled = false;
    }
    if (this.xbot) this.xbot.visible = false;
    this.setPsxMeshesVisible(true);
  }

  setMoveLabel(text) {
    const g = this._labelCtx;
    const c = this._labelCanvas;
    g.clearRect(0, 0, c.width, c.height);
    if (!text) { this.moveLabel.visible = false; this._labelTex.needsUpdate = true; return; }
    g.fillStyle = 'rgba(0,0,0,0.55)';
    g.fillRect(8, 8, 240, 48);
    g.fillStyle = '#9fe870';
    g.font = 'bold 28px ui-sans-serif, system-ui, sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(text, 128, 34);
    this._labelTex.needsUpdate = true;
    this.moveLabel.visible = true;
  }

  play(name, loop = false, timeScale = 1) {
    const next = this.clips[name];
    if (!next) return;
    next.reset();
    next.setLoop(loop ? THREE.LoopRepeat : THREE.LoopOnce, Infinity);
    next.clampWhenFinished = !loop;
    next.timeScale = timeScale;
    next.enabled = true;
    if (this.current && this.current !== next) {
      this.current.fadeOut(0.1);
      next.reset().fadeIn(0.1).play();
    } else {
      next.play();
    }
    this.current = next;
  }

  face(point) {
    const dx = point.x - this.root.position.x;
    const dz = point.z - this.root.position.z;
    if (dx * dx + dz * dz > 1e-6) this.root.rotation.y = Math.atan2(dx, dz);
  }

  bodyPoints() {
    // Prefer Mixamo torso if this fighter is mid-kick (so mutual kicks collide)
    const src = (this.usingXbot && this.xbotBones.hips) ? this.xbotBones : this.bones;
    const keys = ['hips', 'spine', 'head'];
    const pts = [];
    for (const key of keys) {
      const b = src[key];
      if (!b) continue;
      const p = new THREE.Vector3();
      b.getWorldPosition(p);
      pts.push(p);
    }
    if (!pts.length) {
      const p = this.root.position.clone();
      p.y += 1.0;
      pts.push(p);
    }
    return pts;
  }

  strikePoints(limb) {
    if (limb === 'foot' && this.usingXbot) {
      const pts = [];
      for (const key of ['lFoot', 'rFoot']) {
        const b = this.xbotBones[key];
        if (!b) continue;
        const p = new THREE.Vector3();
        b.getWorldPosition(p);
        pts.push({ p, key });
      }
      return pts;
    }
    const keys = limb === 'foot' ? ['lFoot', 'rFoot'] : ['lHand', 'rHand'];
    const pts = [];
    for (const key of keys) {
      const b = this.bones[key];
      if (!b) continue;
      const p = new THREE.Vector3();
      b.getWorldPosition(p);
      pts.push({ p, key });
    }
    return pts;
  }

  limbsTouch(target, limb) {
    const strikes = this.strikePoints(limb || 'hand');
    const bodies = target.bodyPoints();
    const r = (limb === 'foot') ? FOOT_HIT_R : HAND_HIT_R;
    let best = Infinity;
    let which = null;
    for (const s of strikes) {
      for (const b of bodies) {
        const d = s.p.distanceTo(b);
        if (d < best) { best = d; which = s.key; }
      }
    }
    return best <= r ? { ok: true, dist: best, limb: which } : { ok: false, dist: best, limb: which };
  }

  /** Procedural kick fallback if X Bot missing. */
  applyKickPose(now) {
    if (this.kickDur <= 0) return;
    const t = (now - this.kickT) / this.kickDur;
    if (t < 0 || t > 1) {
      this.resetKickBones();
      this.kickDur = 0;
      return;
    }
    let swing;
    if (t < 0.45) swing = (t / 0.45);
    else if (t < 0.7) swing = 1;
    else swing = 1 - (t - 0.7) / 0.3;
    swing = Math.max(0, Math.min(1, swing));
    const side = this.kickSide;
    const up = this.bones[side + 'UpLeg'];
    const mid = this.bones[side + 'Leg'];
    if (!up) return;
    const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(-1.35 * swing, 0.15 * swing, 0.25 * swing));
    up.quaternion.copy(this._rest[side + 'UpLeg']).multiply(q);
    if (mid && this._rest[side + 'Leg']) {
      const q2 = new THREE.Quaternion().setFromEuler(new THREE.Euler(0.55 * swing, 0, 0));
      mid.quaternion.copy(this._rest[side + 'Leg']).multiply(q2);
    }
  }

  resetKickBones() {
    for (const k of ['lUpLeg', 'lLeg', 'rUpLeg', 'rLeg']) {
      if (this.bones[k] && this._rest[k]) this.bones[k].quaternion.copy(this._rest[k]);
    }
  }

  pickMove() {
    const roll = Math.random();
    if (roll < 0.34) return 'jab';
    if (roll < 0.72) return 'kick';
    return 'heavy';
  }

  startMove(id, now) {
    const m = MOVES[id];
    this.move = id;
    this.state = 'attack';
    this.setMoveLabel(m.label);
    this.hitLanded = false;
    if (id === 'kick') {
      const scale = m.timeScale || 1.3;
      const ok = this.beginXbotKick(scale);
      if (ok) {
        const clipDur = (this.xbotAction.getClip().duration || 3.7) / scale;
        const dur = Math.min(m.dur, clipDur * 0.98);
        this.kickT = now;
        this.kickDur = 0;
        this.busyUntil = now + dur;
        this.cooldown = 0.85 + Math.random() * 0.45;
        this.pendingHit = {
          at: now + m.hitAt,
          until: now + (m.hitEnd || m.hitAt + 0.5),
          target: this.target,
          limb: 'foot',
          move: id,
          window: true,
        };
      } else {
        // procedural fallback
        this.play('idle', true, 0.3);
        this.kickSide = Math.random() < 0.5 ? 'l' : 'r';
        this.kickT = now;
        this.kickDur = m.dur;
        this.busyUntil = now + m.dur;
        this.cooldown = 0.75 + Math.random() * 0.4;
        this.pendingHit = { at: now + m.hitAt, target: this.target, limb: 'foot', move: id };
      }
    } else {
      const scale = id === 'heavy' ? 0.72 : 1.15;
      this.play('attack', false, scale);
      const ad = (this.clips.attack?.getClip().duration || 0.55) / scale;
      this.busyUntil = now + Math.min(ad, m.dur) * 0.95;
      this.cooldown = (id === 'heavy' ? 1.0 : 0.55) + Math.random() * 0.35;
      this.pendingHit = { at: now + m.hitAt, target: this.target, limb: 'hand', move: id };
    }
  }

  update(dt, now) {
    this.mixer.update(dt);
    if (this.xbotMixer && this.usingXbot) this.xbotMixer.update(dt);

    if (this.move === 'kick' && !this.usingXbot) this.applyKickPose(now);
    else if (this.kickDur > 0 && this.move !== 'kick') { this.resetKickBones(); this.kickDur = 0; }

    if (!this.alive) return;
    this.cooldown -= dt;

    if (this.pendingHit && now >= this.pendingHit.at) {
      const ph = this.pendingHit;
      const tgt = ph.target;
      const m = MOVES[ph.move] || MOVES.jab;
      if (ph.window) {
        if (this.hitLanded || !this.alive || !tgt?.alive || now > (ph.until || ph.at)) {
          this.pendingHit = null;
        } else {
          const touch = this.limbsTouch(tgt, ph.limb);
          if (touch.ok) {
            this.hitLanded = true;
            this.pendingHit = null;
            const dmg = m.dmg[0] + Math.random() * (m.dmg[1] - m.dmg[0]);
            tgt.takeHit(dmg, now, this, m.label);
          }
        }
      } else {
        this.pendingHit = null;
        if (this.alive && tgt?.alive) {
          const touch = this.limbsTouch(tgt, ph.limb);
          if (touch.ok) {
            const dmg = m.dmg[0] + Math.random() * (m.dmg[1] - m.dmg[0]);
            tgt.takeHit(dmg, now, this, m.label);
          }
        }
      }
    }

    if (now < this.busyUntil) {
      if (this.state === 'attack' && this.target?.alive) {
        this.face(this.target.root.position);
        const me = this.root.position;
        const them = this.target.root.position;
        const dist = me.distanceTo(them);
        const step = (MOVES[this.move] || MOVES.jab).step;
        if (dist > ATTACK_STOP + 0.04) {
          const dir = new THREE.Vector3(them.x - me.x, 0, them.z - me.z).normalize();
          me.addScaledVector(dir, step * dt);
        }
      }
      return;
    }

    if (this.state === 'attack') {
      this.endXbotKick();
      this.resetKickBones();
      this.kickDur = 0;
      this.move = null;
      this.setMoveLabel('');
      this.state = 'idle';
      this.play('idle', true);
    }

    if (!this.target || !this.target.alive) {
      if (this.state !== 'idle') { this.state = 'idle'; this.play('idle', true); }
      return;
    }

    const me = this.root.position;
    const them = this.target.root.position;
    const dist = me.distanceTo(them);
    this.face(them);

    if (dist < ATTACK_STOP) {
      const dir = new THREE.Vector3(me.x - them.x, 0, me.z - them.z);
      if (dir.lengthSq() < 1e-6) dir.set(1, 0, 0);
      dir.normalize();
      me.addScaledVector(dir, (ATTACK_STOP - dist) * 0.5);
    }

    const nextMove = this.cooldown <= 0 ? this.pickMove() : null;
    const need = nextMove ? MOVES[nextMove].enter : ATTACK_ENTER;

    if (dist > need) {
      const run = dist > 2.8;
      if (this.state !== (run ? 'run' : 'walk')) {
        this.state = run ? 'run' : 'walk';
        this.play(this.state, true);
      }
      const speed = run ? 2.8 : 1.5;
      const dir = new THREE.Vector3(them.x - me.x, 0, them.z - me.z).normalize();
      me.addScaledVector(dir, speed * dt);
      const r = Math.hypot(me.x, me.z);
      if (r > 7.2) me.multiplyScalar(7.2 / r);
    } else if (nextMove) {
      this.startMove(nextMove, now);
    } else if (this.state !== 'idle' && this.state !== 'attack') {
      this.state = 'idle';
      this.play('idle', true);
    }
  }

  takeHit(dmg, now, attacker, moveLabel) {
    if (!this.alive) return;
    this.hp = Math.max(0, this.hp - dmg);
    this.endXbotKick();
    this.resetKickBones();
    this.kickDur = 0;
    this.pendingHit = null;
    this.move = null;
    this.setMoveLabel(moveLabel ? ('中：' + moveLabel) : '');
    if (attacker) {
      const me = this.root.position;
      const them = attacker.root.position;
      const dir = new THREE.Vector3(me.x - them.x, 0, me.z - them.z);
      if (dir.lengthSq() > 1e-6) {
        dir.normalize();
        me.addScaledVector(dir, moveLabel === '重拳' || moveLabel === '旋風腳' || moveLabel === '掃踢' ? 0.36 : 0.18);
      }
    }
    if (this.hp <= 0) {
      this.alive = false;
      this.state = 'death';
      this.setMoveLabel('');
      this.play('death', false);
      this.marker.visible = false;
      return;
    }
    this.state = 'hit';
    this.play('hit', false);
    const hd = this.clips.hit?.getClip().duration || 0.35;
    this.busyUntil = now + hd * 0.9;
    const self = this;
    setTimeout(() => {
      if (!self.alive) return;
      if (self.state === 'hit') {
        self.state = 'idle';
        self.setMoveLabel('');
        self.play('idle', true);
      }
    }, hd * 900);
  }
}

const loader = new GLTFLoader();
loader.setMeshoptDecoder(MeshoptDecoder);
const fighters = [];
let resetting = false;
/** Deduped GLTF loads (office/survivor shared by 2 fighters each). */
const gltfCache = new Map();
let xbotLoadPromise = null;

function loadGltf(url) {
  if (!gltfCache.has(url)) gltfCache.set(url, loader.loadAsync(url));
  return gltfCache.get(url);
}

/** Background-load Mixamo X Bot; attach to fighters when ready. */
function ensureXbotLoaded() {
  if (xbotTemplate) return Promise.resolve(xbotTemplate);
  if (xbotLoadPromise) return xbotLoadPromise;
  xbotLoadPromise = (async () => {
    try {
      if (MeshoptDecoder.ready) await MeshoptDecoder.ready;
      const spinGltf = await loader.loadAsync('models/spin_flip_kick_xbot.glb');
      const clip = spinGltf.animations.find((a) => /mixamo|spin|layer/i.test(a.name)) || spinGltf.animations[0];
      if (!clip) throw new Error('no animation in xbot glb');
      xbotTemplate = { scene: spinGltf.scene, clip };
      for (const f of fighters) {
        if (!f.xbot) f.attachXbot(xbotTemplate);
      }
      console.info('xbot kick loaded', clip.name, 'dur', clip.duration, 'tracks', clip.tracks.length);
      return xbotTemplate;
    } catch (e) {
      console.warn('xbot kick missing, procedural fallback', e);
      xbotTemplate = null;
      return null;
    }
  })();
  return xbotLoadPromise;
}

async function spawn(spec, index, total) {
  const gltf = await loadGltf(spec.url);
  // Clone so two roster entries sharing a URL get independent skeletons/meshes
  const root = SkeletonUtils.clone(gltf.scene);
  root.traverse((o) => {
    if (o.isMesh) {
      o.castShadow = true;
      o.receiveShadow = true;
      if (o.material) {
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        for (const m of mats) { m.metalness = 0; m.roughness = 0.9; }
      }
    }
  });
  const mixer = new THREE.AnimationMixer(root);
  const actions = {};
  for (const clip of gltf.animations) actions[clip.name] = mixer.clipAction(clip);
  const clips = clipMap(actions, spec.tag);
  const ang = (index / total) * Math.PI * 2;
  root.position.set(Math.cos(ang) * 3.2, 0, Math.sin(ang) * 3.2);
  root.rotation.y = ang + Math.PI;
  scene.add(root);
  const f = new Fighter(root, mixer, clips, spec.name, spec.tint);
  if (xbotTemplate) f.attachXbot(xbotTemplate);
  return f;
}

function pickTargets() {
  const alive = fighters.filter((f) => f.alive);
  for (const f of fighters) {
    if (!f.alive) { f.target = null; continue; }
    const others = alive.filter((o) => o !== f);
    if (!others.length) { f.target = null; continue; }
    others.sort((a, b) => a.root.position.distanceToSquared(f.root.position) - b.root.position.distanceToSquared(f.root.position));
    f.target = others[0];
  }
}

function maybeReset(now) {
  if (resetting) return;
  if (fighters.filter((f) => f.alive).length >= 2) return;
  resetting = true;
  setTimeout(() => {
    for (let i = 0; i < fighters.length; i++) {
      const f = fighters[i];
      f.endXbotKick();
      f.hp = 100;
      f.alive = true;
      f.state = 'idle';
      f.busyUntil = 0;
      f.cooldown = 0.3 + Math.random();
      f.marker.visible = true;
      const ang = (i / fighters.length) * Math.PI * 2 + Math.random() * 0.4;
      const r = 2.8 + Math.random() * 1.5;
      f.root.position.set(Math.cos(ang) * r, 0, Math.sin(ang) * r);
      f.play('idle', true);
    }
    pickTargets();
    resetting = false;
  }, 1600);
}

async function main() {
  setStatus('Loading characters…');
  // Prefetch unique PSX models in parallel (2 URLs, not 4 serial)
  await Promise.all([...new Set(ROSTER.map((r) => r.url))].map(loadGltf));
  const spawned = await Promise.all(ROSTER.map((spec, i) => spawn(spec, i, ROSTER.length)));
  fighters.push(...spawned);
  pickTargets();

  // X Bot (~meshopt) loads in background — kick falls back to procedural until ready
  ensureXbotLoaded();

  const clock = new THREE.Clock();
  function tick() {
    const dt = Math.min(clock.getDelta(), 0.05);
    const now = performance.now() / 1000;
    for (const f of fighters) f.update(dt, now);
    pickTargets();
    maybeReset(now);
    const hp = fighters.map((f) => `${f.name} ${f.alive ? Math.ceil(f.hp) : 'KO'}`).join(' · ');
    setStatus(xbotTemplate ? hp : (hp + ' · 旋風腳載入中…'));
    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }
  tick();
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

main().catch((e) => {
  console.error(e);
  setStatus('Load failed: ' + e.message);
});
